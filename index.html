<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ولنتاینِ مخصوصِ تو ❤️</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1>یک والنتاین برای تو 💌</h1>
      <p class="subtitle">هر بار که دکمه رو بزنی، یک کارت جدید و مخصوص می‌گیری ✨</p>
    </header>

    <section class="card-area">
      <div id="valentineCard" class="card">
        <div class="figures">
          <!-- دو SVG کنار هم: خانم و آقا -->
          <div id="female" class="figure" aria-hidden="true">
            <!-- Lego-style female with glasses, brown hair -->
            <svg viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg" role="img">
              <defs>
                <clipPath id="hairClipF"><rect x="0" y="0" width="200" height="120" rx="20" /></clipPath>
              </defs>
              <!-- body -->
              <rect x="40" y="140" width="120" height="80" rx="12" fill="#f06f9a"/>
              <!-- neck stud -->
              <rect x="90" y="115" width="20" height="20" rx="8" fill="#f5d7b3"/>
              <!-- head -->
              <rect x="50" y="48" width="100" height="80" rx="18" fill="#f5d7b3"/>
              <!-- hair (brown) -->
              <g clip-path="url(#hairClipF)">
                <rect x="20" y="20" width="160" height="90" rx="30" fill="#6b3f2b"/>
                <path d="M20,60 Q40,10 100,20 Q160,10 180,60 L180,95 Q160,70 100,80 Q40,70 20,95 Z" fill="#563325" opacity="0.95"/>
              </g>
              <!-- glasses -->
              <g transform="translate(40,85)" fill="none" stroke="#222" stroke-width="4">
                <rect x="0" y="0" width="36" height="20" rx="6" />
                <rect x="64" y="0" width="36" height="20" rx="6" />
                <path d="M36,10 L64,10" />
              </g>
              <!-- eyes -->
              <circle cx="80" cy="95" r="3" fill="#111"/>
              <circle cx="120" cy="95" r="3" fill="#111"/>
              <!-- smile -->
              <path d="M82,112 Q100,120 118,112" stroke="#8b3b3b" stroke-width="3" fill="none" stroke-linecap="round"/>
            </svg>
          </div>

          <div id="male" class="figure" aria-hidden="true">
            <!-- Lego-style male with moustache and black hair -->
            <svg viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg" role="img">
              <defs>
                <clipPath id="hairClipM"><rect x="0" y="0" width="200" height="120" rx="20" /></clipPath>
              </defs>
              <!-- body -->
              <rect x="40" y="140" width="120" height="80" rx="12" fill="#4a90e2"/>
              <!-- neck stud -->
              <rect x="90" y="115" width="20" height="20" rx="8" fill="#f5d7b3"/>
              <!-- head -->
              <rect x="50" y="48" width="100" height="80" rx="18" fill="#f5d7b3"/>
              <!-- hair (black) -->
              <g clip-path="url(#hairClipM)">
                <rect x="20" y="20" width="160" height="90" rx="30" fill="#0b0b0b"/>
                <path d="M20,60 Q40,10 100,20 Q160,10 180,60 L180,95 Q160,70 100,80 Q40,70 20,95 Z" fill="#000" opacity="0.98"/>
              </g>
              <!-- eyes -->
              <circle cx="80" cy="95" r="3" fill="#111"/>
              <circle cx="120" cy="95" r="3" fill="#111"/>
              <!-- moustache -->
              <path d="M75,108 Q90,118 105,108 Q120,118 135,108" stroke="#2b1b11" stroke-width="5" stroke-linecap="round" fill="none"/>
              <!-- smile under moustache -->
              <path d="M82,124 Q100,130 118,124" stroke="#8b3b3b" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
            </svg>
          </div>
        </div>

        <div class="message-area">
          <p id="valentineMessage" class="message">برای تو، با کلی عشق...</p>
        </div>

        <div class="controls">
          <button id="newBtn" class="btn">دریافت والنتاین جدید 💘</button>
          <button id="surpriseBtn" class="btn btn-quiet">ارسال برای اون (کپی لینک)</button>
        </div>
      </div>
    </section>

    <div id="heartsContainer" aria-hidden="true"></div>

    <footer class="footer">
      <small>محصول: سورپرایز ولنتاین — ❤️</small>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
